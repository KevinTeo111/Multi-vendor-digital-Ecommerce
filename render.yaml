# Render Blueprint for the API (reference). Blueprints require a card on file even for free plans;
# without a card create the service manually with the same values (see README, Deployment).
# The web app is deployed on Vercel from apps/web.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: marketplace-api
    runtime: node
    plan: free # sleeps after 15 min idle (30-60 s cold start); "starter" (7 USD/mo) keeps it warm but needs a card
    region: ohio # pick the region closest to your Neon database
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run prisma:generate -w apps/api && npm run build -w apps/api
    # Pre-deploy commands need a paid plan. On the free plan run migrations from your PC:
    #   DATABASE_URL="<prod url>" npm run migrate:apply -w apps/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: API_URL
        sync: false # https://marketplace-api.onrender.com (fill in after the first deploy)
      - key: WEB_URL
        sync: false # https://your-site.vercel.app (comma-separated list allowed)
      - key: DATABASE_URL
        sync: false # Neon direct connection string, sslmode=require, no channel_binding
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: S3_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: marketplace-files
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: DOWNLOAD_URL_TTL_SECONDS
        value: 300
      - key: PAYMENT_GATEWAY
        value: mock # switch to pagarme once the account is approved
      - key: PAGARME_SECRET_KEY
        sync: false
      - key: PAGARME_PUBLIC_KEY
        sync: false
      - key: PAGARME_WEBHOOK_SECRET
        sync: false
